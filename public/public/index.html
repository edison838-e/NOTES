<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>NOTES</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">NOTES<span>.</span></a>
    <div class="top-actions">
      <span id="saveStatus" class="status">PUBLIC JOURNAL</span>
      <button id="editBtn" class="text-button">EDIT</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="section-label">YOUR SPACE</div>
      <button id="newNoteBtn" class="new-note" hidden>＋ NEW NOTE</button>
      <nav id="noteList" class="note-list"></nav>
      <div class="sidebar-foot">A PLACE FOR YOUR THOUGHTS.</div>
    </aside>

    <section class="editor-wrap">
      <div class="date-line" id="dateLine"></div>
      <input id="noteTitle" class="note-title" placeholder="Untitled" maxlength="160" readonly>
      <textarea id="noteBody" class="note-body" placeholder="Start writing..." readonly></textarea>
      <div class="bottom-line">
        <span id="updatedLine">A QUIET CORNER OF THE INTERNET.</span>
        <span id="wordCount">0 WORDS</span>
      </div>
    </section>
  </main>

  <footer class="player">
    <div class="track-info">
      <span class="sound-dot"></span>
      <span id="musicLabel">SOUND OFF</span>
    </div>
    <div class="player-controls">
      <button id="playBtn" class="play-button">▶</button>
      <span class="player-caption">BACKGROUND MUSIC</span>
    </div>
    <div class="volume-wrap">
      <span>VOL</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.35">
    </div>
    <audio id="audio" loop></audio>
  </footer>

  <div id="loginModal" class="modal" hidden>
    <form id="loginForm" class="modal-card">
      <button type="button" id="closeModal" class="close-button">×</button>
      <div class="section-label">PRIVATE ACCESS</div>
      <h2>Welcome back.</h2>
      <p>Enter your password to edit NOTES.</p>
      <input id="password" type="password" placeholder="Password" required>
      <button class="primary-button" type="submit">UNLOCK</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>

  <div id="musicModal" class="modal" hidden>
    <form id="musicForm" class="modal-card">
      <button type="button" id="closeMusicModal" class="close-button">×</button>
      <div class="section-label">A LITTLE ATMOSPHERE</div>
      <h2>Background music</h2>
      <p>Paste a direct link to an MP3 audio file.</p>
      <input id="musicUrl" type="url" placeholder="https://example.com/music.mp3">
      <button class="primary-button" type="submit">SAVE MUSIC</button>
      <div id="musicError" class="error"></div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
